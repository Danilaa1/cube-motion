<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cube-motion</title>
  <style>
    body { margin: 0; padding: 48px 24px; font: 15px/1.5 system-ui, sans-serif; color: #18181a; background: #fafafa; }
    main { max-width: 480px; margin: 0 auto; display: grid; gap: 24px; }
    .card, .toast { padding: 16px; background: #fff; border: 1px solid #e4e4e6; border-radius: 12px; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #d8d8dc; border-radius: 999px; background: #fff; cursor: pointer; transition: scale 320ms cubic-bezier(0.2, 0, 0, 1); }
    button:active { scale: 0.97; transition-duration: 120ms; }
    .faces { position: relative; display: inline-flex; align-items: center; }
    .faces > * { display: inline-flex; align-items: center; white-space: nowrap; will-change: opacity, filter, scale; font-style: normal; }
    .faces > .inactive { position: absolute; inset: 0; opacity: 0; }
    .spacer { height: 120vh; }
  </style>
</head>
<body>
  <main>
    <h1>cube-motion</h1>
    <p>rise on load, morph and leave on the button, reveal below the fold. Press is CSS.</p>
    <button id="save"><span class="faces"><i id="off">Save</i><i id="on" class="inactive" aria-hidden="true" inert>Saved</i></span></button>
    <div class="toast" id="toast" hidden>Saved</div>
    <div class="spacer"></div>
    <div class="card">one</div>
    <div class="card">two</div>
    <div class="card">three</div>
  </main>
  <script type="module">
    // Run `npm run build` first; the example reads the compiled output.
    import { rise, leave, morph, reveal } from "../dist/index.js";

    rise("main > :not(.spacer, .card, .toast)");
    reveal(".card");

    const off = document.querySelector("#off");
    const on = document.querySelector("#on");
    const toast = document.querySelector("#toast");
    let saved = false;
    document.querySelector("#save").addEventListener("click", async () => {
      saved = !saved;
      morph(saved ? off : on, saved ? on : off);
      if (saved) {
        toast.hidden = false;
        rise(toast);
      } else {
        try {
          await Promise.all(leave(toast).map((a) => a.finished));
          if (!saved) toast.hidden = true;
        } catch (error) {
          if (error.name !== "AbortError") throw error;
        }
      }
    });
  </script>
</body>
</html>
